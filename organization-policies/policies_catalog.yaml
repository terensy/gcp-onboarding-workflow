    attach_level: organization
    folder_override_allowed: false
    enabled: true
    cis_ref: []
    notes: >
      Google 預設自動強制；顯性 codify 成 Terraform 資源以便每次 apply 都
      重新確認/校正實際生效狀態，而非只信任預設值（drift 防護）。

  - id: iam.allowServiceAccountCredentialLifetimeExtension
